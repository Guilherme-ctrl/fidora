name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formatting
        # `--set-exit-if-changed` rather than a reformat commit: the diff a
        # formatter produces on someone else's branch is noise in review.
        run: dart format --output=none --set-exit-if-changed lib test

      # Infos are not fatal until the palette migration is done. The Ledger
      # tokens landed with `@Deprecated` bridges so 270 call sites keep
      # compiling, and every use is reported as an info — 197 of them, which is
      # the worklist, not a regression. Warnings and errors still fail the
      # build. PR 5 deletes the bridges and restores `--fatal-infos`; that
      # restoration is the gate on PR 5.
      - run: flutter analyze --no-fatal-infos

      # Goldens are excluded: a reference image rendered on macOS does not
      # match one rendered on Linux, and these exist to be looked at during
      # design review, not to gate a merge. Run them locally with
      # `flutter test --tags golden`.
      - run: flutter test --exclude-tags golden

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres, Auth and Storage in containers and applies every
      # migration in order. This is the point of the job: the SQL below has
      # never been exercised anywhere else — the app's own tests run against an
      # in-memory repository and cannot reach a constraint, a policy or an RPC.
      - name: Start Supabase
        run: supabase start --exclude studio,realtime,inbucket,imgproxy,edge-runtime

      - name: Migrations apply from scratch
        # A migration that only works against the current production database
        # is a migration that cannot be replayed. `supabase start` has already
        # applied them; this proves the reset path too.
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      # The runner has no Deno. The first run of this workflow failed here with
      # `deno: command not found`, after everything that mattered had already
      # passed.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function tests
        run: deno test supabase/functions/capture-transaction/rules_test.ts

      - name: Show logs on failure
        if: failure()
        run: supabase status || true
