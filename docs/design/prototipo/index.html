<title>Finora Ledger</title>
<style>
/* ============ CHROME TOKENS (a superfície de revisão) ============ */
:root{
  --c-bg:#EBECE9; --c-panel:#FBFBF9; --c-ink:#0E1112; --c-muted:#565E5F;
  --c-faint:#7C8586; --c-line:#DCDEDA; --c-line2:#C3C7C2;
  --c-accent:#8A6A18; --c-accent-ink:#5E4810; --c-accent-soft:#F2EBD7;
  --c-onaccent:#FFFFFF; --c-flag:#A33A1F; --c-shadow:0 1px 2px rgba(20,30,25,.06),0 12px 34px -12px rgba(20,30,25,.22);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --c-bg:#090B0B; --c-panel:#121514; --c-ink:#EDEFEC; --c-muted:#98A1A0;
  --c-faint:#798382; --c-line:#212625; --c-line2:#333937;
  --c-accent:#D9B860; --c-accent-ink:#E9D296; --c-accent-soft:#221D0F;
  --c-onaccent:#151206; --c-flag:#E5836A; --c-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --c-bg:#090B0B; --c-panel:#121514; --c-ink:#EDEFEC; --c-muted:#98A1A0;
  --c-faint:#798382; --c-line:#212625; --c-line2:#333937;
  --c-accent:#D9B860; --c-accent-ink:#E9D296; --c-accent-soft:#221D0F;
  --c-onaccent:#151206; --c-flag:#E5836A; --c-shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -14px rgba(0,0,0,.7);
}

/* ============ APP TOKENS — "Fólio": tinta sobre papel, pautado a latão ============ */
[data-app="light"]{
  --a-canvas:#FBFBF9; --a-surface:#FFFFFF; --a-sunken:#F3F4F1;
  --a-ink:#0E1112; --a-muted:#525A5B; --a-subtle:#6B7476;
  --a-rule:#E3E5E1; --a-rule2:#C7CBC6; --a-rule3:#0E1112;
  --a-brand:#0E1112; --a-onbrand:#FBFBF9;
  --a-accent:#8A6A18; --a-accent-soft:#F4EDD9;
  --a-income:#0B6B4F; --a-negative:#A33A1F; --a-pending:#8A6A18;
  --a-pendbg:#F4EDD9; --a-ignored:#8B9394;
  --a-card:linear-gradient(148deg,#14181A 0%,#252E2E 55%,#3A4441 100%);
  --a-c1:#2F6F5B; --a-c2:#3B5C8A; --a-c3:#B8892E; --a-c4:#A8452F; --a-c5:#5A7D8C; --a-c6:#7A5A8C;
}
[data-app="dark"]{
  --a-canvas:#0E1112; --a-surface:#161A1B; --a-sunken:#0A0D0D;
  --a-ink:#EDEFEC; --a-muted:#9AA3A2; --a-subtle:#7F8988;
  --a-rule:#232827; --a-rule2:#343A39; --a-rule3:#EDEFEC;
  --a-brand:#EDEFEC; --a-onbrand:#0E1112;
  --a-accent:#D9B860; --a-accent-soft:#241E10;
  --a-income:#5CC79B; --a-negative:#E5836A; --a-pending:#D9B860;
  --a-pendbg:#241E10; --a-ignored:#6E7877;
  --a-card:linear-gradient(148deg,#0C0F10 0%,#1E2626 55%,#333D3A 100%);
  --a-c1:#5CC79B; --a-c2:#7C9BD1; --a-c3:#D9B860; --a-c4:#E5836A; --a-c5:#93B4C4; --a-c6:#B197C4;
}

*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--ui);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---- page shell ---- */
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,3vw,40px) 96px}
.masthead{padding:44px 0 26px;border-bottom:1px solid var(--c-line);
  display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-faint);margin-bottom:12px}
.masthead h1{font-family:var(--serif);font-size:clamp(32px,4.6vw,50px);letter-spacing:-.018em;font-weight:500;line-height:1.02}
.masthead h1 em{font-style:normal;color:var(--c-accent)}
.lede{margin:14px 0 0;max-width:56ch;color:var(--c-muted);font-size:16px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{border:1px solid var(--c-line2);border-radius:999px;padding:8px 15px;font-size:13px;
  font-family:var(--mono);color:var(--c-muted);background:var(--c-panel);transition:.15s}
.tog:hover{border-color:var(--c-accent);color:var(--c-ink)}
.tog[aria-pressed="true"]{background:var(--c-accent);border-color:var(--c-accent);color:var(--c-onaccent)}

/* ---- layout ---- */
.cols{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;margin-top:32px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px}
@media(max-width:900px){.nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:8px}}
.navgrp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-faint);padding:18px 10px 6px}
@media(max-width:900px){.navgrp{display:none}}
.navi{text-align:left;padding:8px 11px;border-radius:8px;font-size:14px;color:var(--c-muted);
  white-space:nowrap;display:flex;justify-content:space-between;gap:10px;align-items:center}
.navi:hover{background:var(--c-panel);color:var(--c-ink)}
.navi[aria-current="true"]{background:var(--c-accent-soft);color:var(--c-accent-ink);font-weight:600}
.navi kbd{font-family:var(--mono);font-size:10px;color:var(--c-faint)}

.stagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.stagehead h2{font-size:23px;letter-spacing:-.02em;font-weight:600}
.route{font-family:var(--mono);font-size:12px;color:var(--c-accent);background:var(--c-accent-soft);
  padding:3px 9px;border-radius:6px}
.stagesub{color:var(--c-muted);font-size:14.5px;max-width:70ch;margin:0 0 22px}

/* ---- device frames ---- */
.stage{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
.browser{flex:1 1 640px;min-width:0;border:1px solid var(--c-line2);border-radius:10px;
  overflow:hidden;background:var(--c-panel);box-shadow:var(--c-shadow)}
.bbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--c-line);
  background:var(--c-panel)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--c-line2)}
.urlbar{flex:1;background:var(--c-bg);border:1px solid var(--c-line);border-radius:7px;
  padding:5px 11px;font-family:var(--mono);font-size:11.5px;color:var(--c-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar b{color:var(--c-ink);font-weight:600}
.bnavbtn{color:var(--c-faint);font-size:15px;padding:0 3px}
.viewport{container-type:inline-size;background:var(--a-canvas);color:var(--a-ink);height:660px;overflow:auto;position:relative}
.viewport::-webkit-scrollbar{width:9px}
.viewport::-webkit-scrollbar-thumb{background:var(--a-rule);border-radius:9px}

.phonewrap{flex:0 0 auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.phone{width:322px;height:660px;border-radius:42px;padding:11px;background:#101413;
  box-shadow:0 2px 3px rgba(0,0,0,.3),0 26px 50px -18px rgba(0,0,0,.5);position:relative;flex:0 0 auto}
.pscreen{width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--a-canvas);
  color:var(--a-ink);display:flex;flex-direction:column;position:relative}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:26px;
  background:#101413;border-radius:0 0 16px 16px;z-index:40}
.pstatus{display:flex;justify-content:space-between;padding:9px 22px 3px;font-size:11.5px;
  font-weight:600;color:var(--a-ink);flex:0 0 auto}
.pbody{flex:1;overflow:auto}
.pbody::-webkit-scrollbar{width:0}
.devlabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-faint)}

/* ============ APP INTERNALS — sem cards, o que separa é a pauta ============ */
.app{display:flex;min-height:100%;font-size:14px}
.side{width:212px;flex:0 0 auto;background:var(--a-canvas);border-right:1px solid var(--a-rule);
  padding:16px 0;display:flex;flex-direction:column;gap:1px;min-height:660px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 16px 16px}
.mark{width:24px;height:24px;border-radius:3px;background:var(--a-ink);color:var(--a-canvas);
  display:grid;place-items:center;font-family:var(--serif);font-size:15px;flex:0 0 auto}
.brand span{font-weight:600;letter-spacing:.01em;font-size:15px}
.cmdk{margin:0 12px 10px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--a-rule2);border-radius:5px;padding:5px 8px;color:var(--a-subtle);font-size:12px}
.cmdk kbd{font-family:var(--mono);font-size:10px;color:var(--a-subtle)}
.sgrp{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--a-subtle);padding:16px 16px 6px;margin-top:4px;border-top:1px solid var(--a-rule)}
.side .sgrp:first-of-type{border-top:0;margin-top:0}
.sitem{display:flex;align-items:center;gap:9px;padding:6px 16px;color:var(--a-muted);
  text-align:left;width:100%;font-size:13.5px;border-left:2px solid transparent}
.sitem:hover{color:var(--a-ink);background:var(--a-sunken)}
.sitem[aria-current="true"]{color:var(--a-ink);font-weight:600;border-left-color:var(--a-accent);background:var(--a-sunken)}
.sitem .dot{width:14px;text-align:center;font-size:12px;color:var(--a-subtle)}
.sitem[aria-current="true"] .dot{color:var(--a-accent)}
.pill{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--a-onbrand);
  background:var(--a-negative);border-radius:2px;padding:0 5px}
[data-app="light"] .pill{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mhead{padding:22px 30px 16px;border-bottom:1px solid var(--a-rule);
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mhead h3{font-size:19px;letter-spacing:-.005em;font-weight:600}
.mhead p{margin:4px 0 0;color:var(--a-subtle);font-size:12.5px}
.periodbar{display:flex;gap:0;align-items:center;border:1px solid var(--a-rule2);border-radius:5px;overflow:hidden}
.pchip{padding:5px 12px;font-size:12.5px;color:var(--a-muted);border-right:1px solid var(--a-rule2)}
.pchip:last-child{border-right:0}
.pchip[aria-pressed="true"]{background:var(--a-ink);color:var(--a-canvas);font-weight:600}
.mbody{padding:0 30px 40px;display:flex;flex-direction:column}
.mbody>:first-child{margin-top:20px}
.pcontent>:first-child{margin-top:14px}
.pcontent{padding:0 18px 96px;display:flex;flex-direction:column}

/* “card” virou seção pautada — o que era Material vira documento */
.card{background:transparent;border:0;border-top:1px solid var(--a-rule);border-radius:0;
  padding:20px 0 22px;min-width:0}
.mbody>.card:first-child,.pcontent>.card:first-child{border-top:0}
.card.tight{padding:16px 0 18px}
/* objeto discreto: mantém superfície */
.card.obj{background:var(--a-surface);border:1px solid var(--a-rule);border-radius:10px;padding:18px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.cardhead h4{font-size:13px;font-weight:600;letter-spacing:.005em}
.cardhead a,.more{font-family:var(--mono);font-size:11px;color:var(--a-accent);letter-spacing:.02em}
.lbl{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--a-subtle)}

.hero{padding:26px 0 24px;border-bottom:2px solid var(--a-rule3);
  display:flex;justify-content:space-between;gap:22px;align-items:flex-end;flex-wrap:wrap}
.heronum{font-family:var(--serif);font-size:58px;line-height:.95;font-weight:500;
  letter-spacing:-.022em;font-variant-numeric:tabular-nums lining-nums;margin-top:8px}
.heronum small{font-size:.42em;color:var(--a-subtle);letter-spacing:0}
.delta{font-family:var(--mono);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.up{color:var(--a-negative)}.down{color:var(--a-income)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
@container (max-width:620px){.grid3{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
@container (max-width:820px){.grid2{grid-template-columns:1fr}}
.grid2>.card{padding-right:26px}
.grid2>.card+.card{border-left:1px solid var(--a-rule);padding-left:26px;padding-right:0}
@container (max-width:820px){.grid2>.card+.card{border-left:0;padding-left:0}}

/* tile: pauta pesada no topo, como cabeçalho de coluna de livro-razão */
.tile{border-top:2px solid var(--a-rule3);padding:11px 20px 16px 0;margin-top:20px}
.grid3>.tile+.tile{border-left:1px solid var(--a-rule);padding-left:20px}
.tile .v{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-.012em;
  font-variant-numeric:tabular-nums lining-nums;margin-top:7px}
.tile .m{font-family:var(--mono);font-size:10.5px;color:var(--a-subtle);margin-top:5px;letter-spacing:.02em}

/* linha do razão: marca tipográfica, zebra, e a coluna de valor separada por pauta */
.row{display:flex;align-items:center;gap:11px;padding:8px 10px 8px 0;border-top:1px solid var(--a-rule)}
.row:first-of-type{border-top:0}
.row:nth-of-type(even){background:var(--a-sunken)}
.ico,.mk{width:26px;height:26px;border-radius:3px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.02em;
  color:var(--a-muted);background:var(--a-surface);
  border:1px solid var(--a-rule2);border-left:3px solid var(--a-c1)}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain span{font-family:var(--mono);font-size:10.5px;color:var(--a-subtle);letter-spacing:.01em}
.amt{font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;text-align:right;white-space:nowrap;
  min-width:104px;padding-left:16px;border-left:1px solid var(--a-rule)}
.amt.in{color:var(--a-income);font-weight:600}
.amt.ign{color:var(--a-ignored);text-decoration:line-through}

.tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border-radius:2px;padding:2px 5px;white-space:nowrap;border:1px solid transparent}
.tag.pend{color:var(--a-pending);border-color:var(--a-pending)}
.tag.ok{color:var(--a-subtle);border-color:var(--a-rule2)}
.tag.neu{color:var(--a-ignored);border-color:var(--a-rule2)}

table.led{width:100%;border-collapse:collapse;font-size:13px}
table.led th{background:var(--a-canvas);text-align:left;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--a-subtle);font-weight:600;
  padding:0 10px 8px;border-bottom:2px solid var(--a-rule3);white-space:nowrap}
table.led td{padding:8px 10px;border-bottom:1px solid var(--a-rule);vertical-align:middle}
table.led tbody tr:nth-child(even) td{background:var(--a-sunken)}
table.led tr:hover td{background:var(--a-accent-soft)}
table.led .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;
  border-left:1px solid var(--a-rule)}
table.led tr.sel td{box-shadow:inset 2px 0 0 var(--a-accent)}
.bulkbar{display:flex;align-items:center;gap:12px;background:var(--a-ink);color:var(--a-canvas);
  border-radius:5px;padding:9px 13px;font-size:12.5px;font-weight:500;margin-top:16px}
.bulkbar button{border:1px solid rgba(150,150,150,.4);border-radius:4px;padding:3px 9px;font-size:11.5px}

.bar{height:4px;background:var(--a-rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a-ink)}
.bar i.over{background:var(--a-negative)}

.btn{border-radius:5px;padding:7px 14px;font-size:12.5px;font-weight:600;border:1px solid transparent;
  letter-spacing:.005em}
.btn.pri{background:var(--a-brand);color:var(--a-onbrand)}
.btn.gho{border-color:var(--a-rule2);color:var(--a-ink);background:transparent}
.btn.gho:hover{border-color:var(--a-ink)}
.btn.sm{padding:5px 11px;font-size:12px}

.tl{display:flex;align-items:center;gap:0;margin:16px 0 8px}
.tl .seg{flex:1;height:1px;background:var(--a-rule2)}
.tl .seg.done{background:var(--a-accent);height:2px}
.tl .nd{width:9px;height:9px;border-radius:50%;border:2px solid var(--a-accent);background:var(--a-canvas);flex:0 0 auto}
.tl .nd.fill{background:var(--a-accent)}
.tl .nd.open{border-color:var(--a-rule2)}
.tlx{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--a-subtle);font-variant-numeric:tabular-nums;letter-spacing:.02em}

.tabbar{display:flex;background:var(--a-canvas);border-top:1px solid var(--a-rule);
  padding:0 2px calc(6px + env(safe-area-inset-bottom));position:absolute;bottom:0;left:0;right:0;z-index:30}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);
  font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--a-subtle);
  padding:9px 0 5px;position:relative;border-top:2px solid transparent;margin-top:-1px}
.tb[aria-current="true"]{color:var(--a-ink);border-top-color:var(--a-accent);font-weight:700}
.tb .g{font-size:15px;line-height:1}
.tb .bdg{position:absolute;top:4px;right:calc(50% - 18px);background:var(--a-negative);color:#fff;
  font-family:var(--mono);font-size:8.5px;font-weight:700;border-radius:2px;padding:0 3px}
.tb.mid .g{width:34px;height:26px;border-radius:4px;background:var(--a-brand);color:var(--a-onbrand);
  display:grid;place-items:center;font-size:16px}
.ptop{padding:8px 18px 14px;display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:1px solid var(--a-rule);margin-bottom:2px}
.ptop h3{font-size:21px;letter-spacing:-.01em;font-weight:600;margin-top:3px}
.ptop .ico{border-left-width:1px}

.swipe{position:relative;overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:center;
  padding-right:16px;background:var(--a-negative);color:#fff;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.swipe .over{position:relative;background:var(--a-canvas);transform:translateX(-62px)}

/* ---- annotation ---- */
.notes{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{border:1px solid var(--c-line);border-left:3px solid var(--c-accent);border-radius:0 10px 10px 0;
  background:var(--c-panel);padding:13px 15px}
.note h5{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--c-accent);margin:0 0 6px;font-weight:600}
.note p{margin:0;font-size:13.5px;color:var(--c-muted);line-height:1.55}
.note p b{color:var(--c-ink);font-weight:600}
.note.flag{border-left-color:var(--c-flag)}
.note.flag h5{color:var(--c-flag)}

/* ---- design system view ---- */
.dsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.dscard{background:var(--c-panel);border:1px solid var(--c-line);border-radius:8px;padding:18px 20px}
.dscard h4{font-size:13px;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.sw{display:flex;align-items:center;gap:11px;padding:6px 0;font-family:var(--mono);font-size:11.5px;color:var(--c-muted)}

 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="overflow:visible">

/* ---------- render ---------- */
let cur='hoje';
const appMode=()=>$('#tApp').getAttribute('aria-pressed')==='true'?'dark':'light';
const navHTML=()=>{let g='',h='';for(const [id,d] of Object.entries(S)){
 if(d.g!==g){g=d.g;h+=`<div class="navgrp">${g}</div>`}
 h+=`<button class="navi" data-screen="${id}" ${cur===id?'aria-current="true"':''}>${d.t}</button>`}return h};

function draw(){
 const d=S[cur];
 $('#sTitle').textContent=d.t; $('#sRoute').textContent=d.r; $('#sSub').textContent=d.s;
 $('#nav').innerHTML=navHTML();
 if(d.kind==='panel'){
   $('#sBody').innerHTML=`<div data-app="${appMode()}">`+(cur==='sistema'?panelSistema():panelNomes())+`</div>`;
 }else{
   const u=d.r.split('/'); const host=u.shift(); const path=u.length?'/'+u.join('/'):'';
   $('#sBody').innerHTML=`<div class="stage" data-app="${appMode()}">
    <div class="browser"><div class="bbar"><div class="dots"><i></i><i></i><i></i></div>
      <span class="bnavbtn">‹</span><span class="bnavbtn">›</span>
      <div class="urlbar">${host}<b>${path}</b></div><span class="bnavbtn">⋯</span></div>
     <div class="viewport"><div class="app">${sidebar(cur)}<div class="main">${DESK[cur]()}</div></div></div></div>
    <div class="phonewrap"><div class="phone"><div class="notch"></div><div class="pscreen">
      <div class="pstatus"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
      <div class="pbody">${MOB[cur]()}</div>${d.tab?tabbar(d.tab):''}</div></div>
     <div class="devlabel">iPhone · 393 × 852</div></div></div>`;
 }
 $('#sNotes').innerHTML=(d.n||[]).map(([t,p])=>{const f=t.startsWith('flag|');
   return `<div class="note ${f?'flag':''}"><h5>${f?t.slice(5):t}</h5><p>${p}</p></div>`}).join('');
 window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
 const n=e.target.closest('[data-screen]'); if(n){cur=n.dataset.screen;draw();return}
 const g=e.target.closest('[data-goto]');
 if(g){const k=g.dataset.goto; if(S[k]){cur=k;draw()} }
});

/* tema da página */
$('#tTheme').addEventListener('click',()=>{
 const r=document.documentElement;
 const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
 r.setAttribute('data-theme',dark?'light':'dark');
});
/* tema do app */
$('#tApp').addEventListener('click',e=>{
 const on=e.currentTarget.getAttribute('aria-pressed')==='true';
 e.currentTarget.setAttribute('aria-pressed',String(!on));
 e.currentTarget.textContent=on?'☾ App em escuro':'☀ App em claro';
 document.querySelectorAll('[data-app]').forEach(n=>n.setAttribute('data-app',on?'light':'dark'));
});

draw();
</script>
